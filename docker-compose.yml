# Local Postgres for development: `docker compose up -d db`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sny
      POSTGRES_PASSWORD: sny
      POSTGRES_DB: sny_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sny -d sny_tracker"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
